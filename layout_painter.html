<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Painter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0b09; color: #d4cfc7; font-family: 'Courier New', monospace; overflow: hidden; }

  #app { display: flex; flex-direction: column; height: 100vh; padding: 12px 14px; gap: 10px; }

  /* HEADER */
  #header { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #1c1c18; padding-bottom: 9px; flex-shrink: 0; }
  #header-title { color: #c8a84b; font-size: 15px; letter-spacing: 3px; font-weight: bold; }
  #header-id { color: #252518; font-size: 11px; }
  #header-size { color: #1c1c18; font-size: 11px; }
  #header-nav { margin-left: auto; display: flex; gap: 5px; }

  /* BODY */
  #body { display: flex; gap: 12px; flex: 1; min-height: 0; }

  /* CANVAS COLUMN */
  #canvas-col { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }

  /* TOOLBAR */
  #toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
  .sep { width: 1px; height: 16px; background: #1c1c18; margin: 0 4px; }
  .tool-label { color: #282820; font-size: 10px; letter-spacing: 1px; }

  /* GRID WRAPPER */
  #grid-wrap { flex: 1; overflow: auto; background: #060605; border: 1px solid #181815; padding: 10px; }
  #grid { display: inline-grid; gap: 1px; }
  .cell {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold; cursor: default;
    border: 1px solid #0e0e0c; transition: background 0.04s;
    user-select: none;
  }
  .cell:hover { cursor: crosshair; }

  /* STATUS */
  #status { display: flex; gap: 16px; font-size: 10px; color: #282820; letter-spacing: 0.5px; align-items: center; min-height: 14px; flex-shrink: 0; }
  #status-right { margin-left: auto; }

  /* PALETTE */
  #palette-row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; padding-top: 6px; border-top: 1px solid #131310; flex-shrink: 0; }
  #palette-label { color: #1e1e18; font-size: 10px; letter-spacing: 1.5px; margin-right: 4px; }
  .swatch {
    width: 30px; height: 30px; border: 1px solid #181815;
    font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.08s; background: transparent; flex-shrink: 0;
  }
  .swatch.active { border-width: 2px; }
  .swatch-null { font-size: 7px; opacity: 0.35; }

  /* RIGHT PANEL */
  #right-panel { width: 264px; flex-shrink: 0; background: #0e0e0c; border: 1px solid #181815; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .panel-head { color: #c8a84b; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; border-bottom: 1px solid #1c1c18; padding-bottom: 8px; margin-bottom: 12px; }
  .field-label { color: #3a3a2e; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; display: block; margin-bottom: 4px; }
  .field-group { display: flex; flex-direction: column; gap: 10px; }
  input[type=text], input[type=number], select, textarea {
    background: #080807; color: #d4cfc7; border: 1px solid #222;
    padding: 5px 8px; font-family: 'Courier New', monospace; font-size: 12px;
    outline: none; width: 100%;
  }
  textarea { resize: vertical; line-height: 1.55; }
  select option { background: #0e0e0c; }

  /* BUTTONS */
  .btn {
    background: transparent; color: #3e3e2e; border: 1px solid #1e1e18;
    padding: 4px 11px; cursor: pointer; font-family: 'Courier New', monospace;
    font-size: 11px; letter-spacing: 0.5px; line-height: 1.4; transition: all 0.08s;
  }
  .btn:hover { color: #c8a84b; border-color: #c8a84b44; }
  .btn.active-gold { background: #c8a84b22; color: #c8a84b; border-color: #c8a84b88; }
  .btn.active-amber { background: #9b8a4a22; color: #9b8a4a; border-color: #9b8a4a88; }
  .btn.active-blue  { background: #4a7a9b22; color: #4a7a9b; border-color: #4a7a9b88; }
  .btn.active-green { background: #4a9b6b22; color: #4a9b6b; border-color: #4a9b6b88; }
  .btn.full { width: 100%; padding: 7px 0; }

  /* LEGEND LIST */
  #legend-list { display: flex; flex-direction: column; gap: 5px; }
  .legend-row { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #0a0a08; border: 1px solid #161614; }
  .legend-swatch { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
  .legend-tile-input { flex: 1; font-size: 11px !important; padding: 3px 6px !important; }
  .legend-del { background: none; border: none; color: #282820; cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1; flex-shrink: 0; font-family: 'Courier New', monospace; }
  .legend-del:hover { color: #9b4a4a; }
  input[type=color] { width: 22px; height: 22px; padding: 0; border: none; background: none; cursor: pointer; flex-shrink: 0; }

  .add-row { display: flex; gap: 5px; align-items: center; }
  .add-char { width: 34px !important; text-align: center; padding: 4px !important; }
  input[type=color].add-color { width: 26px; height: 26px; }

  /* QUICK REF */
  #quick-ref { margin-top: 8px; padding: 10px; background: #0a0a08; border: 1px solid #161614; font-size: 11px; line-height: 1.8; }
  .qr-label { color: #2e2e26; margin-bottom: 4px; font-size: 10px; letter-spacing: 1px; }
  .qr-row span.ch { font-weight: bold; }
  .qr-row span.tid { color: #222; }

  /* JSON OUTPUT */
  #json-out { color: #5a7a5a; font-size: 11px; min-height: 420px; }

  /* IMPORT */
  #import-txt { color: #5a7a5a; font-size: 11px; min-height: 260px; }
  .import-note { color: #2a2a22; font-size: 11px; line-height: 1.7; }

  /* MISC */
  .panel { display: none; flex-direction: column; gap: 10px; }
  .panel.visible { display: flex; }
  .panel-header-row { display: flex; justify-content: space-between; align-items: center; }
  .panel-header-row .panel-head { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }

  label.check-label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: #32322a; font-size: 11px; }
  input[type=checkbox] { accent-color: #4a7a9b; }

  .size-x { color: #1e1e18; }
  input.size-num { width: 44px !important; text-align: center; padding: 3px 4px !important; }

  .divider { border-top: 1px solid #181815; padding-top: 10px; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <span id="header-title">LAYOUT PAINTER</span>
    <span id="header-id">new_layout</span>
    <span id="header-size">10×10</span>
    <div id="header-nav">
      <button class="btn active-gold" data-panel="meta" onclick="switchPanel('meta')">meta</button>
      <button class="btn" data-panel="legend" onclick="switchPanel('legend')">legend</button>
      <button class="btn" data-panel="import" onclick="switchPanel('import')">import</button>
      <button class="btn" data-panel="json" onclick="switchPanel('json')">json</button>
    </div>
  </div>

  <!-- BODY -->
  <div id="body">

    <!-- CANVAS COLUMN -->
    <div id="canvas-col">

      <!-- TOOLBAR -->
      <div id="toolbar">
        <button class="btn active-gold" id="btn-paint" onclick="setTool('paint')">✎ paint</button>
        <button class="btn" id="btn-erase" onclick="setTool('erase')">⌫ erase</button>
        <button class="btn" id="btn-fill"  onclick="setTool('fill')">◈ fill</button>
        <div class="sep"></div>
        <span class="tool-label">LAYER</span>
        <button class="btn active-amber" id="btn-terrain" onclick="setLayer('terrain')">terrain</button>
        <button class="btn" id="btn-decor" onclick="setLayer('decor')" style="display:none">decor</button>
        <label class="check-label">
          <input type="checkbox" id="chk-decor" onchange="toggleDecor(this.checked)"> decor layer
        </label>
        <div class="sep"></div>
        <span class="tool-label">SIZE</span>
        <input type="number" class="size-num" id="inp-w" value="10" min="4" max="48" onchange="doResize(+this.value, state.gridH)">
        <span class="size-x">×</span>
        <input type="number" class="size-num" id="inp-h" value="10" min="4" max="48" onchange="doResize(state.gridW, +this.value)">
      </div>

      <!-- GRID -->
      <div id="grid-wrap">
        <div id="grid"></div>
      </div>

      <!-- STATUS -->
      <div id="status">
        <span id="status-left">hover grid for tile info</span>
        <span id="status-right">layer: <span id="st-layer" style="color:#9b8a4a">terrain</span>&nbsp;&nbsp;sel: <span id="st-sel" style="color:#8b7d6b">#</span></span>
      </div>

      <!-- PALETTE -->
      <div id="palette-row">
        <span id="palette-label">PALETTE</span>
        <div id="swatches" style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;"></div>
      </div>

    </div>

    <!-- RIGHT PANEL -->
    <div id="right-panel">

      <!-- META PANEL -->
      <div id="panel-meta" class="panel visible">
        <div class="panel-head">Metadata</div>
        <div class="field-group">
          <div><label class="field-label">Layout ID</label><input type="text" id="meta-id" value="new_layout" oninput="onMetaChange()"></div>
          <div><label class="field-label">Description</label><input type="text" id="meta-desc" value="" oninput="onMetaChange()"></div>
          <div><label class="field-label">Note</label><input type="text" id="meta-note" value="" oninput="onMetaChange()"></div>
          <div><label class="field-label">Weight</label><input type="number" id="meta-weight" value="1.0" step="0.1" oninput="onMetaChange()"></div>
          <div><label class="field-label">Category</label>
            <select id="meta-cat" onchange="onMetaChange()">
              <option>plaza</option><option>residential</option><option>commercial</option>
              <option>civic</option><option>religious</option><option>storage</option>
              <option>ruins</option><option>wilderness</option>
            </select>
          </div>
          <div><label class="field-label">Allowed In</label>
            <select id="meta-allowed" onchange="onMetaChange()">
              <option>town</option><option>capital</option><option>any</option>
            </select>
          </div>
        </div>
        <div id="quick-ref">
          <div class="qr-label">QUICK REF</div>
          <div id="qr-entries"></div>
        </div>
      </div>

      <!-- LEGEND PANEL -->
      <div id="panel-legend" class="panel">
        <div class="panel-head">Legend</div>
        <div id="legend-list"></div>
        <div class="divider">
          <span class="field-label">Add Entry</span>
          <div class="add-row">
            <input type="text" class="add-char" id="nl-char" maxlength="1" placeholder="ch">
            <input type="text" id="nl-tile" placeholder="tile_id" style="flex:1">
            <input type="color" class="add-color" id="nl-color" value="#8b7355">
          </div>
          <button class="btn full" onclick="addLegendEntry()">+ Add to Legend</button>
        </div>
      </div>

      <!-- IMPORT PANEL -->
      <div id="panel-import" class="panel">
        <div class="panel-head">Import JSON</div>
        <p class="import-note">Paste an existing layout JSON. Legend colours are reassigned on load.</p>
        <textarea id="import-txt" rows="14" placeholder='{"id":"my_layout","layers":[...]}'></textarea>
        <button class="btn full" onclick="doImport()">LOAD LAYOUT</button>
      </div>

      <!-- JSON PANEL -->
      <div id="panel-json" class="panel">
        <div class="panel-header-row" style="margin-bottom:12px;border-bottom:1px solid #1c1c18;padding-bottom:8px;">
          <span class="panel-head">JSON Output</span>
          <button class="btn" id="btn-copy" onclick="doCopy()">copy</button>
        </div>
        <textarea id="json-out" rows="28" readonly></textarea>
      </div>

    </div>
  </div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────

const LEGEND_COLORS = [
  '#8b7d6b','#6b8f6b','#7a6b9b','#9b4a4a','#4a7a9b',
  '#9b8a4a','#5a8b7a','#8b5a4a','#6b7a8b','#9b6b4a',
  '#4a9b6b','#8b4a7a','#c8a84b','#4a6b9b','#7a8b4a',
];

const state = {
  gridW: 10, gridH: 10,
  terrain: Array(100).fill(' '),
  decor:   Array(100).fill(' '),
  legend: [
    { char: ' ', tileId: null,               color: '#1a1a1a' },
    { char: '#', tileId: 'grey_stone',       color: '#8b7d6b' },
    { char: '.', tileId: 'flagstone',        color: '#6b6b5a' },
    { char: '+', tileId: 'door_closed',      color: '#9b6b4a' },
    { char: 'f', tileId: 'flagstone',        color: '#5a5a48' },
    { char: 'w', tileId: 'waystone_plinth',  color: '#7a6b9b' },
    { char: 'B', tileId: 'bell_cracked',     color: '#c8a84b' },
    { char: 'p', tileId: 'town_plaza',       color: '#4a5a4a' },
  ],
  useDecor: false,
  activeLayer: 'terrain',
  selChar: '#',
  tool: 'paint',
  panel: 'meta',
  painting: false,
};

// ─── HELPERS ──────────────────────────────────────────────────────────────────

function getColor(ch) {
  return state.legend.find(e => e.char === ch)?.color ?? '#3a3a30';
}

function legendEntry(ch) {
  return state.legend.find(e => e.char === ch);
}

function resizeGrid(grid, ow, oh, nw, nh) {
  const next = Array(nw * nh).fill(' ');
  for (let y = 0; y < Math.min(oh, nh); y++)
    for (let x = 0; x < Math.min(ow, nw); x++)
      next[y * nw + x] = grid[y * ow + x];
  return next;
}

function doResize(nw, nh) {
  nw = Math.max(4, Math.min(48, nw || 4));
  nh = Math.max(4, Math.min(48, nh || 4));
  state.terrain = resizeGrid(state.terrain, state.gridW, state.gridH, nw, nh);
  state.decor   = resizeGrid(state.decor,   state.gridW, state.gridH, nw, nh);
  state.gridW = nw; state.gridH = nh;
  document.getElementById('inp-w').value = nw;
  document.getElementById('inp-h').value = nh;
  renderAll();
}

// ─── TOOL / LAYER / PANEL SWITCHING ──────────────────────────────────────────

function setTool(t) {
  state.tool = t;
  document.getElementById('btn-paint').className = 'btn' + (t==='paint'?' active-gold':'');
  document.getElementById('btn-erase').className = 'btn' + (t==='erase'?' active-gold':'');
  document.getElementById('btn-fill' ).className = 'btn' + (t==='fill' ?' active-gold':'');
}

function setLayer(l) {
  state.activeLayer = l;
  document.getElementById('btn-terrain').className = 'btn' + (l==='terrain'?' active-amber':'');
  document.getElementById('btn-decor'  ).className = 'btn' + (l==='decor'  ?' active-blue' :'');
  document.getElementById('st-layer').style.color = l==='terrain'?'#9b8a4a':'#4a7a9b';
  document.getElementById('st-layer').textContent = l;
}

function toggleDecor(on) {
  state.useDecor = on;
  document.getElementById('btn-decor').style.display = on ? '' : 'none';
  if (!on) setLayer('terrain');
}

function switchPanel(p) {
  state.panel = p;
  ['meta','legend','import','json'].forEach(name => {
    document.getElementById('panel-' + name).className = 'panel' + (name===p?' visible':'');
    const btn = document.querySelector(`[data-panel="${name}"]`);
    btn.className = 'btn' + (name===p?' active-gold':'');
  });
  if (p === 'json') refreshJson();
}

function onMetaChange() {
  document.getElementById('header-id').textContent = document.getElementById('meta-id').value || 'new_layout';
}

// ─── GRID PAINTING ────────────────────────────────────────────────────────────

function setCell(x, y, ch) {
  if (x < 0 || x >= state.gridW || y < 0 || y >= state.gridH) return;
  const i = y * state.gridW + x;
  if (state.activeLayer === 'terrain') state.terrain[i] = ch;
  else                                 state.decor[i]   = ch;
  updateCell(x, y);
}

function floodFill(sx, sy, fillCh) {
  const src = state.activeLayer === 'terrain' ? state.terrain : state.decor;
  const tgt = src[sy * state.gridW + sx];
  if (tgt === fillCh) return;
  const stk = [[sx, sy]];
  while (stk.length) {
    const [x, y] = stk.pop();
    if (x < 0 || x >= state.gridW || y < 0 || y >= state.gridH) continue;
    const i = y * state.gridW + x;
    if (src[i] !== tgt) continue;
    src[i] = fillCh;
    updateCell(x, y);
    stk.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
}

function getCellEl(x, y) {
  return document.getElementById(`c-${x}-${y}`);
}

function updateCell(x, y) {
  const el = getCellEl(x, y);
  if (!el) return;
  const tc = state.terrain[y * state.gridW + x];
  const dc = state.decor  [y * state.gridW + x];
  const showCh = (state.useDecor && dc !== ' ') ? dc : tc;
  const showCol = getColor(showCh);
  const bg = tc === ' ' ? '#040403' : getColor(tc) + '18';
  el.style.background = bg;
  el.style.color = showCol;
  el.style.border = (state.useDecor && dc !== ' ')
    ? '1px solid #4a7a9b28'
    : '1px solid #0e0e0c';
  el.textContent = showCh !== ' ' ? showCh : '';
}

function onCellDown(x, y, e) {
  e.preventDefault();
  state.painting = true;
  const ch = state.tool === 'erase' ? ' ' : state.selChar;
  if (state.tool === 'fill') floodFill(x, y, ch);
  else setCell(x, y, ch);
}

function onCellOver(x, y) {
  // status bar
  const tc = state.terrain[y * state.gridW + x];
  const dc = state.decor  [y * state.gridW + x];
  const tl = legendEntry(tc), dl = (dc && dc !== ' ') ? legendEntry(dc) : null;
  let info = `<span style="color:#363628">${x},${y}</span>`;
  if (tl) info += ` &nbsp;T: <span style="color:${tl.color}">${tc === ' ' ? '∅' : tc}</span> → ${tl.tileId ?? 'null'}`;
  if (dl) info += ` &nbsp;D: <span style="color:${dl.color}">${dc}</span> → ${dl.tileId ?? 'null'}`;
  document.getElementById('status-left').innerHTML = info;

  if (state.painting && state.tool !== 'fill') {
    const ch = state.tool === 'erase' ? ' ' : state.selChar;
    setCell(x, y, ch);
  }
}

// ─── FULL RENDER ─────────────────────────────────────────────────────────────

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${state.gridW}, 26px)`;
  grid.innerHTML = '';
  document.getElementById('header-size').textContent = `${state.gridW}×${state.gridH}`;

  for (let y = 0; y < state.gridH; y++) {
    for (let x = 0; x < state.gridW; x++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.id = `c-${x}-${y}`;
      el.addEventListener('mousedown', e => onCellDown(x, y, e));
      el.addEventListener('mouseover', () => onCellOver(x, y));
      grid.appendChild(el);
      updateCell(x, y);
    }
  }
}

function renderSwatches() {
  const wrap = document.getElementById('swatches');
  wrap.innerHTML = '';
  state.legend.forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'swatch' + (state.selChar === e.char ? ' active' : '');
    btn.title = `${e.char === ' ' ? 'empty' : e.char} → ${e.tileId ?? 'null'}`;
    btn.style.color = e.color;
    btn.style.background = state.selChar === e.char ? e.color + '2e' : e.color + '0f';
    btn.style.borderColor = state.selChar === e.char ? e.color : '#181815';
    if (e.char === ' ') {
      const s = document.createElement('span');
      s.className = 'swatch-null'; s.textContent = '∅';
      btn.appendChild(s);
    } else {
      btn.textContent = e.char;
    }
    btn.addEventListener('click', () => { state.selChar = e.char; setTool('paint'); renderSwatches(); updateSelStatus(); });
    wrap.appendChild(btn);
  });
}

function renderLegendList() {
  const list = document.getElementById('legend-list');
  list.innerHTML = '';
  state.legend.forEach(e => {
    const row = document.createElement('div');
    row.className = 'legend-row';

    const sw = document.createElement('div');
    sw.className = 'legend-swatch';
    sw.style.background = e.color + '18';
    sw.style.border = `1px solid ${e.color}44`;
    sw.style.color = e.color;
    if (e.char === ' ') { const s = document.createElement('span'); s.className='swatch-null'; s.textContent='∅'; sw.appendChild(s); }
    else sw.textContent = e.char;

    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'legend-tile-input';
    inp.value = e.tileId ?? '';
    inp.placeholder = 'tile_id';
    inp.addEventListener('input', ev => { e.tileId = ev.target.value || null; renderQuickRef(); });

    const col = document.createElement('input');
    col.type = 'color'; col.value = e.color;
    col.addEventListener('input', ev => {
      e.color = ev.target.value;
      sw.style.background = e.color + '18';
      sw.style.border = `1px solid ${e.color}44`;
      sw.style.color = e.color;
      renderSwatches(); renderQuickRef();
      // re-render all cells that use this char
      for (let y=0;y<state.gridH;y++) for(let x=0;x<state.gridW;x++) updateCell(x,y);
    });

    row.appendChild(sw); row.appendChild(inp); row.appendChild(col);

    if (e.char !== ' ') {
      const del = document.createElement('button');
      del.className = 'legend-del'; del.textContent = '×';
      del.addEventListener('click', () => {
        state.legend = state.legend.filter(x => x.char !== e.char);
        if (state.selChar === e.char) { state.selChar = '#'; updateSelStatus(); }
        renderAll();
      });
      row.appendChild(del);
    }

    list.appendChild(row);
  });
}

function renderQuickRef() {
  const el = document.getElementById('qr-entries');
  el.innerHTML = '';
  state.legend.filter(e => e.char !== ' ').forEach(e => {
    const div = document.createElement('div');
    div.className = 'qr-row';
    div.innerHTML = `<span class="ch" style="color:${e.color}">${e.char}</span><span class="tid"> → ${e.tileId ?? 'null'}</span>`;
    el.appendChild(div);
  });
}

function updateSelStatus() {
  const col = getColor(state.selChar);
  const el = document.getElementById('st-sel');
  el.style.color = col;
  el.textContent = state.selChar === ' ' ? '∅' : state.selChar;
}

function renderAll() {
  renderGrid();
  renderSwatches();
  renderLegendList();
  renderQuickRef();
  updateSelStatus();
}

// ─── ADD LEGEND ENTRY ────────────────────────────────────────────────────────

function addLegendEntry() {
  const ch    = document.getElementById('nl-char').value;
  const tile  = document.getElementById('nl-tile').value;
  const color = document.getElementById('nl-color').value;
  if (!ch || ch.length !== 1 || state.legend.find(e => e.char === ch)) return;
  state.legend.push({ char: ch, tileId: tile || null, color });
  document.getElementById('nl-char').value = '';
  document.getElementById('nl-tile').value = '';
  renderAll();
}

// ─── JSON ─────────────────────────────────────────────────────────────────────

function generateJson() {
  const legendObj = {};
  state.legend.forEach(e => { legendObj[e.char] = e.tileId; });
  const layers = Array.from({length:state.gridH}, (_,y) =>
    Array.from({length:state.gridW}, (_,x) => state.terrain[y*state.gridW+x]).join(''));
  const obj = {
    id:          document.getElementById('meta-id').value || 'new_layout',
    category:    document.getElementById('meta-cat').value,
    allowed_in:  document.getElementById('meta-allowed').value,
    weight:      parseFloat(document.getElementById('meta-weight').value) || 1.0,
    description: document.getElementById('meta-desc').value,
    legend:      legendObj,
    layers,
  };
  if (state.useDecor) {
    obj.decor_layer = Array.from({length:state.gridH}, (_,y) =>
      Array.from({length:state.gridW}, (_,x) => state.decor[y*state.gridW+x]).join(''));
  }
  const note = document.getElementById('meta-note').value;
  if (note) obj.note = note;
  return JSON.stringify(obj, null, 2);
}

function refreshJson() {
  document.getElementById('json-out').value = generateJson();
}

function doCopy() {
  const txt = generateJson();
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✓ copied'; btn.className = 'btn active-green';
    setTimeout(() => { btn.textContent = 'copy'; btn.className = 'btn'; }, 2000);
  });
}

// ─── IMPORT ───────────────────────────────────────────────────────────────────

function doImport() {
  const txt = document.getElementById('import-txt').value.trim();
  if (!txt) return;
  let obj;
  try { obj = JSON.parse(txt); } catch(e) { alert('Parse error: ' + e.message); return; }

  document.getElementById('meta-id').value      = obj.id          ?? 'imported';
  document.getElementById('meta-desc').value    = obj.description ?? '';
  document.getElementById('meta-note').value    = obj.note        ?? '';
  document.getElementById('meta-weight').value  = obj.weight      ?? 1.0;
  onMetaChange();

  const cats = ['plaza','residential','commercial','civic','religious','storage','ruins','wilderness'];
  const catSel = document.getElementById('meta-cat');
  if (obj.category && cats.includes(obj.category)) catSel.value = obj.category;

  const ains = ['town','capital','any'];
  const ainSel = document.getElementById('meta-allowed');
  if (obj.allowed_in && ains.includes(obj.allowed_in)) ainSel.value = obj.allowed_in;

  if (obj.legend) {
    const ents = Object.entries(obj.legend);
    state.legend = ents.map(([ch,tid],i) => ({
      char: ch, tileId: tid,
      color: ch === ' ' ? '#1a1a1a' : LEGEND_COLORS[i % LEGEND_COLORS.length],
    }));
    const first = ents.find(([ch]) => ch !== ' ');
    if (first) state.selChar = first[0];
  }

  if (obj.layers?.length) {
    const nh = obj.layers.length, nw = obj.layers[0].length;
    state.gridW = nw; state.gridH = nh;
    document.getElementById('inp-w').value = nw;
    document.getElementById('inp-h').value = nh;
    state.terrain = Array(nw*nh).fill(' ');
    obj.layers.forEach((row,y) => { for(let x=0;x<row.length;x++) state.terrain[y*nw+x]=row[x]; });
    state.decor = Array(nw*nh).fill(' ');
  }

  if (obj.decor_layer?.length) {
    state.useDecor = true;
    document.getElementById('chk-decor').checked = true;
    toggleDecor(true);
    const nh=obj.decor_layer.length, nw=obj.decor_layer[0].length;
    state.decor = Array(nw*nh).fill(' ');
    obj.decor_layer.forEach((row,y) => { for(let x=0;x<row.length;x++) state.decor[y*nw+x]=row[x]; });
  }

  document.getElementById('import-txt').value = '';
  renderAll();
  switchPanel('meta');
}

// ─── GLOBAL MOUSE UP ─────────────────────────────────────────────────────────

window.addEventListener('mouseup', () => { state.painting = false; });
document.getElementById('grid-wrap').addEventListener('mouseleave', () => { state.painting = false; });

// ─── KEYBOARD SHORTCUTS ───────────────────────────────────────────────────────

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'p' || e.key === 'P') setTool('paint');
  if (e.key === 'e' || e.key === 'E') setTool('erase');
  if (e.key === 'f' || e.key === 'F') setTool('fill');
  if (e.key === 't' || e.key === 'T') { setLayer('terrain'); }
  if ((e.key === 'd' || e.key === 'D') && state.useDecor) setLayer('decor');
});

// ─── INIT ─────────────────────────────────────────────────────────────────────

renderAll();
</script>
</body>
