[package]
name = "resonance-workbench"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
rfd = "=0.17.2"
tempfile = "=3.27.0"
dunce = "=1.0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
